<title>직트 유튜브 운영 시스템</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --t1:#1a1816; --t2:#4a4440; --t3:#7a736e;
    --bg:#EAE7E1; --card:#ffffff; --card2:#faf7f4; --bg2:#e8dfd6;
    --line:rgba(0,0,0,.07);
    --accent:#5C6672; --accent-grad:linear-gradient(135deg,#8E99A8 0%,#5C6672 55%,#454E5C 100%);
    --bg-grad:#EAE7E1;
    --extreme:#E65C66; --crisis:#C0504D; --caution:#B7791F; --mid:#E3A845; --down:#4F79C2;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg-grad); color:var(--t1);
    font-family:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55; font-size:15px; font-weight:500; font-variant-numeric:tabular-nums;}
  .wrap{max-width:1080px; margin:0 auto; padding:20px 16px 80px;}

  /* header */
  header.top{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line);}
  .top-inner{max-width:1080px; margin:0 auto; padding:14px 16px 12px;}
  .back{display:inline-flex; align-items:center; gap:6px; font-size:15px; font-weight:700; color:var(--accent);
    text-decoration:none; margin-bottom:18px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:9px 16px; transition:background .15s, color .15s;}
  .back:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .title-row{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  h1{font-size:21px; margin:0; font-weight:800; color:var(--t1);}
  .subtitle{font-size:14px; color:var(--t3); margin-top:2px;}

  /* 결 사슬 배너 */
  .chain-bar{margin-top:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .chain-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-weight:700; font-size:15px;}
  .chain-node{background:var(--card2); border-radius:6px; padding:3px 9px; color:var(--t1);}
  .chain-arrow{color:var(--t3); font-weight:400;}
  .chain-quote{font-size:14px; color:var(--t2); margin-top:6px; cursor:pointer;}
  .chain-quote b{color:var(--t1);}
  .chain-detail{display:none; margin-top:8px; font-size:14px; color:var(--t2); border-top:1px dashed var(--line); padding-top:8px;}
  .chain-detail.open{display:block;}
  .chain-detail p{margin:4px 0;}

  /* layer tabs */
  .layer-tabs{display:flex; gap:6px; overflow-x:auto; margin-top:12px; padding-bottom:4px;}
  .layer-tab{flex:0 0 auto; cursor:pointer; border:1px solid var(--line); background:var(--card);
    border-radius:9px; padding:7px 11px; font-size:14px; color:var(--t2); white-space:nowrap;}
  .layer-tab b{color:inherit;}
  .layer-tab.active{background:var(--accent-grad); color:#fff; border-color:var(--accent); font-weight:700;}
  .layer-tab .n{opacity:.65; font-weight:400; margin-right:3px;}

  /* diagnosis toggle */
  .diag-btn{margin-top:10px; font-size:14px; color:var(--t2); background:none; border:1px dashed var(--line);
    border-radius:8px; padding:6px 10px; cursor:pointer;}
  .diag-panel{display:none; margin-top:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .diag-panel.open{display:block;}
  .diag-panel h3{font-size:15px; margin:0 0 8px;}
  table.diag{width:100%; min-width:560px; border-collapse:collapse; font-size:14px;}
  table.diag th{text-align:left; color:var(--t3); font-weight:600; padding:5px 6px; border-bottom:1px solid var(--line);}
  table.diag td{padding:6px 6px; border-bottom:1px solid var(--line); color:var(--t2); vertical-align:top;}
  table.diag td.target{color:var(--t1); font-weight:700; white-space:nowrap;}
  table.diag tr:last-child td{border-bottom:none;}
  table.diag tr:hover td{background:var(--card2); cursor:pointer;}

  /* layer body */
  .layer-head{margin-top:18px;}
  .layer-head .l-name{font-size:20px; font-weight:800;}
  .layer-head .l-meta{font-size:14px; color:var(--t3); margin-top:2px;}
  .layer-head .l-output{font-size:15px; color:var(--t2); margin-top:6px; background:var(--card2); border-radius:8px; padding:8px 10px; display:inline-block;}

  .need{font-size:14px; font-weight:800; white-space:nowrap;}
  .need-empty{color:var(--crisis);}
  .need-part{color:var(--caution);}
  .need-done{color:var(--t3);}
  .l-sum{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .modules{margin-top:14px; display:flex; flex-direction:column; gap:10px;}
  .module{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  .module-head{padding:12px 14px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .module-head-left{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .module-title{font-size:16px; font-weight:700; color:var(--t1);}
  .gate-badge{font-size:14px; font-weight:700; color:var(--t1); background:var(--card2); border-radius:6px; padding:2px 7px;}
  .week-badge{font-size:14px; color:var(--t3);}
  .chev{color:var(--t3); font-size:14px; transition:transform .15s;}
  .module.open .chev{transform:rotate(90deg);}
  .module-body{display:none; padding:0 14px 14px; border-top:1px solid var(--line);}
  .module.open .module-body{display:block;}

  .sec{margin-top:12px;}
  .sec-label{font-size:14px; font-weight:700; color:var(--t3);  letter-spacing:.04em; margin-bottom:6px;}
  blockquote.q{margin:0 0 6px; padding:8px 10px; background:var(--card2); border-left:3px solid var(--t3); border-radius:0 8px 8px 0; font-size:15px; color:var(--t2); font-style:normal;}
  ol.proc{margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:6px;}
  ol.proc li{font-size:15px; color:var(--t2); padding-left:22px; position:relative;}
  ol.proc li .num{position:absolute; left:0; top:0; font-size:14px; font-weight:800; color:var(--t1); background:var(--card2); border-radius:5px; width:16px; height:16px; display:flex; align-items:center; justify-content:center; line-height:1;}
  .pass-box{background:var(--card2); border-radius:8px; padding:8px 10px; font-size:14px; color:var(--t1);}
  .pass-box b{color:var(--down);}
  .pitfall-box{background:var(--card2); border-radius:8px; padding:8px 10px; font-size:14px; color:var(--t2); border-left:3px solid var(--caution);}
  .pitfall-box div{margin:2px 0;}

  .fillins{margin-top:14px; display:flex; flex-direction:column; gap:8px;}
  .fillin{border-radius:8px; padding:9px 10px; border:1px solid var(--line); background:var(--card2);}
  .fillin-head{display:flex; align-items:center; gap:7px; font-size:14px; font-weight:700;}
  .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
  .dot.empty{background:var(--crisis);}
  .dot.partial{background:var(--caution);}
  .dot.filled{background:var(--t3);}
  .fillin.filled .fillin-head{color:var(--t3); font-weight:600;}
  .fillin.empty{border-color:rgba(192,80,77,.35); border-left:3px solid var(--crisis);}
  .status-tag{font-size:14px; font-weight:800; margin-left:auto;}
  .status-tag.empty{color:var(--crisis);}
  .status-tag.partial{color:var(--caution);}
  .status-tag.filled{color:var(--t3);}
  .fillin-source{font-size:14px; color:var(--t3); margin-top:3px;}
  .fillin-content{font-size:14px; color:var(--t1); margin-top:5px;}
  .fillin-note{font-size:14px; color:var(--t3); margin-top:4px; font-style:italic;}

  .scrollx{overflow-x:auto;}
  /* intersection table */
  .xtable{width:100%; min-width:640px; border-collapse:collapse; font-size:14px; margin-top:8px;}
  .xtable th{text-align:left; color:var(--t3); font-weight:600; padding:5px 6px; border-bottom:1px solid var(--line);}
  .xtable td{padding:6px 6px; border-bottom:1px solid var(--line); color:var(--t2); vertical-align:top;}
  .xtable td.rank{color:var(--t1); font-weight:800; text-align:center; width:26px;}
  .xtable td.item{color:var(--t1); font-weight:700; white-space:nowrap;}
  .xtable td.freq{text-align:center; color:var(--t2);}
  .xtable-note{font-size:14px; color:var(--t3); margin-top:6px; line-height:1.5;}
  .xtable-pick{margin-top:8px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; color:var(--t1);}

  /* 물음표 버튼 — 긴 설명은 본문에 늘어놓지 않고 이 안에 넣습니다 */
  .qwrap{display:inline;}
  .qbtn{display:inline-flex; align-items:center; justify-content:center; width:23px; height:23px;
    margin-left:6px; padding:0; border-radius:50%; border:1.5px solid rgba(138,134,128,.45); background:transparent;
    color:var(--t3); font-size:14px; font-weight:800; line-height:1; cursor:pointer; font-family:inherit;
    vertical-align:middle; animation:qpulse 2.6s ease-out infinite;}
  .qbtn:hover{border-color:var(--accent); color:var(--accent);}
  .qwrap.open .qbtn{background:var(--accent); border-color:var(--accent); color:#fff; animation:none;}
  @keyframes qpulse{
    0%{box-shadow:0 0 0 0 rgba(92,102,114,.38);}
    70%{box-shadow:0 0 0 6px rgba(92,102,114,0);}
    100%{box-shadow:0 0 0 0 rgba(92,102,114,0);}
  }
  .qtip{display:none;}
  .qwrap.open .qtip{display:block; margin:7px 0 3px; background:var(--card2); border:1px solid var(--line);
    border-left:3px solid var(--accent); border-radius:0 8px 8px 0; padding:8px 10px;
    font-size:14px; color:var(--t2); line-height:1.6;}

  footer.foot{max-width:1080px; margin:24px auto 0; padding:0 16px; font-size:14px; color:var(--t3); text-align:center;}
</style>

<div class="wrap">
  <div class="layer-head">
    <div class="l-name" id="layer-name"></div>
    <div class="l-meta" id="layer-meta"></div>
    <div class="l-output" id="layer-output"></div>
    <div class="l-sum" id="layer-sum"></div>
  </div>
  <div class="modules" id="modules"></div>
</div>

<footer class="foot">직트 유튜브 운영 시스템 — 노션 「원고 작업 안내판」 원문을 그대로 옮긴 구조. 새 서랍·새 뼈대 없음. 살(실제 내용)만 계속 채워나갑니다.</footer>

<script>
(function(){
  var DATA;
  var raw = document.getElementById('dashboard-data').textContent;
  try{ DATA = JSON.parse(raw); }catch(e){ DATA = null; }

  function tryFetch(){
    if (location.protocol === 'file:') { render(DATA); return; }
    fetch('./structure.json', {cache:'no-store'}).then(function(r){
      if(!r.ok) throw 0; return r.json();
    }).then(function(j){ render(j); }).catch(function(){ render(DATA); });
  }

  var state = { layerId: null, openModule: null };

  function statusLabel(s){ return s==='filled' ? '채워짐' : (s==='partial' ? '부분 채워짐' : '비어있음'); }

  // 본문 안의 [?:설명] 표시를 둥근 물음표 버튼으로 바꿉니다.
  function help(text){
    if(text === null || text === undefined) return '';
    return String(text).replace(/\[\?:([\s\S]*?)\]/g, function(_, t){
      return '<span class="qwrap"><button class="qbtn" type="button">?</button><span class="qtip">'+t+'</span></span>';
    });
  }
  function bindHelp(root){
    root.querySelectorAll('.qbtn').forEach(function(b){
      b.onclick = function(ev){ ev.stopPropagation(); this.parentNode.classList.toggle('open'); };
    });
  }

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  function renderChain(data){
    var row = document.getElementById('chain-row');
    row.innerHTML = '';
    data.axis.chain.forEach(function(node, i){
      if(i>0){ row.appendChild(el('span','chain-arrow','→')); }
      row.appendChild(el('span','chain-node', node));
    });
    var detail = document.getElementById('chain-detail');
    var html = '';
    data.axis.quotes.forEach(function(q){ html += '<p>「'+q+'」</p>'; });
    html += '<p><b>결 확인 요령</b> — '+data.axis.check+'</p>';
    data.axis.other_axes.forEach(function(a){ html += '<p><b>'+a.name+'</b> — '+a.desc+'</p>'; });
    detail.innerHTML = html;
    document.getElementById('chain-toggle').onclick = function(){
      detail.classList.toggle('open');
      this.textContent = (detail.classList.contains('open') ? '▾ ' : '▸ ') + '결 사슬이 뭔가 (누르면 펼침)';
    };
  }

  function renderDiag(data){
    var panel = document.getElementById('diag-panel');
    var html = '<h3>증상별 진단 — 어느 층으로 돌아가나</h3><div class="scrollx"><table class="diag"><tr><th>증상</th><th>원인</th><th>돌아갈 층</th></tr>';
    data.diagnosis_by_layer.forEach(function(r){
      html += '<tr data-target="'+r.target+'"><td>'+r.symptom+'</td><td>'+r.cause+'</td><td class="target">'+r.target+'</td></tr>';
    });
    html += '</table></div>';
    panel.innerHTML = html;
    document.getElementById('diag-toggle').onclick = function(){
      panel.classList.toggle('open');
    };
    panel.querySelectorAll('tr[data-target]').forEach(function(tr){
      tr.onclick = function(){
        var m = this.getAttribute('data-target').match(/(\d+)층/);
        if(m){ selectLayer(parseInt(m[1],10)); panel.classList.remove('open'); window.scrollTo({top:0,behavior:'smooth'}); }
      };
    });
  }

  function renderTabs(data){
    var tabs = document.getElementById('layer-tabs');
    tabs.innerHTML = '';
    data.layers.forEach(function(l){
      var t = el('div','layer-tab','<span class="n">'+l.id+'</span><b>'+l.name+'</b>');
      t.onclick = function(){ selectLayer(l.id); };
      t.dataset.id = l.id;
      tabs.appendChild(t);
    });
  }

  function fillinHtml(f, intersectionData){
    var box = el('div','fillin '+f.status);
    var head = el('div','fillin-head');
    head.appendChild(el('span','dot '+f.status));
    head.appendChild(el('span','', f.title));
    head.appendChild(el('span','status-tag '+f.status, statusLabel(f.status)));
    box.appendChild(head);
    box.appendChild(el('div','fillin-source','재료: '+f.source));
    if(f.content){ box.appendChild(el('div','fillin-content', help(f.content))); }
    if(f.note){ box.appendChild(el('div','fillin-note', help(f.note))); }
    if(f.id === 'l2-f1' && intersectionData){
      box.appendChild(renderIntersection(intersectionData));
    }
    return box;
  }

  function renderIntersection(x){
    var wrap = el('div');
    var scroller = el('div','scrollx');
    var t = el('table','xtable');
    var html = '<tr><th>순위</th><th>가치</th><th>직트의 표현</th><th>빈도(초안)</th><th>대응 문제</th></tr>';
    x.rows.forEach(function(r){
      html += '<tr><td class="rank">'+r.rank_confirmed+'</td><td class="item">'+r.item+'</td><td>'+r.jikt_wording+'</td><td class="freq">'+r.freq_draft+'</td><td>'+r.matched_problems+'</td></tr>';
    });
    t.innerHTML = html;
    scroller.appendChild(t);
    wrap.appendChild(scroller);
    var note = el('div','xtable-note', x.note_confirmed + ' ' + x.note_draft);
    wrap.appendChild(note);
    wrap.appendChild(el('div','xtable-pick', x.top_pick));
    return wrap;
  }

  function moduleHtml(m, data){
    var box = el('div','module');
    box.dataset.id = m.id;
    var head = el('div','module-head');
    var left = el('div','module-head-left');
    left.appendChild(el('span','module-title', m.title));
    if(m.gate !== null && m.gate !== undefined){ left.appendChild(el('span','gate-badge','관문 '+m.gate)); }
    if(m.weeks){ left.appendChild(el('span','week-badge', m.weeks+'주차')); }
    var fs = m.fillins || [];
    var nEmpty = fs.filter(function(f){ return f.status==='empty'; }).length;
    var nPart  = fs.filter(function(f){ return f.status==='partial'; }).length;
    if(nEmpty){ left.appendChild(el('span','need need-empty', '채울 것 '+nEmpty)); }
    else if(nPart){ left.appendChild(el('span','need need-part', '확인할 것 '+nPart)); }
    else if(fs.length){ left.appendChild(el('span','need need-done', '채워짐')); }
    head.appendChild(left);
    head.appendChild(el('span','chev','▸'));
    head.onclick = function(){
      var wasOpen = box.classList.contains('open');
      box.classList.toggle('open', !wasOpen);
    };
    box.appendChild(head);

    var body = el('div','module-body');
    // 무엇을 — 지금 채울 것
    if(m.fillins && m.fillins.length){
      var s5 = el('div','sec');
      s5.appendChild(el('div','sec-label','무엇을 — 지금 채울 것'));
      var fw = el('div','fillins');
      m.fillins.forEach(function(f){ fw.appendChild(fillinHtml(f, data.intersection_table)); });
      s5.appendChild(fw);
      body.appendChild(s5);
    }
    // 얼마나 — 통과 기준
    if(m.pass){
      var s3 = el('div','sec');
      s3.appendChild(el('div','sec-label','얼마나 — 통과 기준'));
      s3.appendChild(el('div','pass-box', help(m.pass)));
      body.appendChild(s3);
    }
    // 어떻게 — 절차
    if(m.procedure && m.procedure.length){
      var s2 = el('div','sec');
      s2.appendChild(el('div','sec-label','어떻게 — 절차'));
      var ol = el('ol','proc');
      m.procedure.forEach(function(p, i){
        var li = el('li','', '<span class="num">'+(i+1)+'</span>'+help(p));
        ol.appendChild(li);
      });
      s2.appendChild(ol);
      body.appendChild(s2);
    }
    if(m.pitfalls && m.pitfalls.length){
      var s4 = el('div','sec');
      s4.appendChild(el('div','sec-label','함정'));
      var pb = el('div','pitfall-box');
      m.pitfalls.forEach(function(p){ pb.appendChild(el('div','', help(p))); });
      s4.appendChild(pb);
      body.appendChild(s4);
    }
    // 왜 — 강의 원문
    if(m.quotes && m.quotes.length){
      var s1 = el('div','sec');
      s1.appendChild(el('div','sec-label','왜 — 강의 원문'));
      m.quotes.forEach(function(q){ s1.appendChild(el('blockquote','q','「'+help(q)+'」')); });
      body.appendChild(s1);
    }
    box.appendChild(body);
    return box;
  }

  function selectLayer(id){
    state.layerId = id;
    document.querySelectorAll('.layer-tab').forEach(function(t){
      t.classList.toggle('active', parseInt(t.dataset.id,10) === id);
    });
    var data = window.__DASHBOARD_DATA__;
    var layer = data.layers.find(function(l){ return l.id === id; });
    if(!layer) return;
    document.getElementById('layer-name').textContent = layer.id + '층 — ' + layer.name;
    document.getElementById('layer-meta').textContent = layer.weeks + '주차';
    document.getElementById('layer-output').textContent = '산출물: ' + layer.output;
    var all = [];
    layer.modules.forEach(function(m){ (m.fillins||[]).forEach(function(f){ all.push(f.status); }); });
    var sum = document.getElementById('layer-sum');
    var e2 = all.filter(function(x){return x==='empty';}).length;
    var p2 = all.filter(function(x){return x==='partial';}).length;
    var f2 = all.filter(function(x){return x==='filled';}).length;
    sum.innerHTML = all.length
      ? '<span class="need need-empty">채울 것 '+e2+'</span><span class="need need-part">확인할 것 '+p2+'</span><span class="need need-done">채워짐 '+f2+'</span>'
      : '<span class="need need-done">이 층에는 채울 칸이 아직 지정되어 있지 않습니다</span>';
    var wrap = document.getElementById('modules');
    wrap.innerHTML = '';
    layer.modules.forEach(function(m){ wrap.appendChild(moduleHtml(m, data)); });
    bindHelp(wrap);
    // 행동이 필요한 카드를 먼저 펼칩니다 — 채울 것 > 확인할 것 > 첫 카드
    var cards = wrap.querySelectorAll('.module');
    var target = wrap.querySelector('.module:has(.need-empty)') || wrap.querySelector('.module:has(.need-part)') || cards[0];
    if(target) target.classList.add('open');
  }

  function render(data){
    if(!data){ document.body.innerHTML = '<p style="padding:20px">데이터를 불러오지 못했습니다.</p>'; return; }
    window.__DASHBOARD_DATA__ = data;
    document.getElementById('page-title').textContent = data.meta.title;
    document.getElementById('page-subtitle').textContent = data.meta.subtitle + ' · ' + data.meta.mode;
    renderChain(data);
    renderDiag(data);
    renderTabs(data);
    var q = (location.search.match(/[?&]layer=(\d+)/)||[])[1];
    selectLayer(q ? parseInt(q,10) : 1); // 기본은 1층, 메인에서 ?layer=2로 들어오면 결 정의 층
  }

  tryFetch();
})();
</script>
